<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fun Padel</title>
<meta name="description" content="Planning, scores en direct, classement, photos et vote du Fun Padel.">
<meta property="og:title" content="Fun Padel">
<meta property="og:description" content="Planning, scores en direct, classement, photos et vote du tournoi.">
<meta property="og:image" content="icone-512.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1b5cb5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fun Padel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,500..900;1,62..125,700..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#edf2f8; --surface:#ffffff; --surface-2:#f4f7fb; --ink:#0e1c32; --muted:#5a6a81; --hair:#d9e2ee;
  --court:#1b5cb5; --court-deep:#123f80; --court-ink:#ffffff; --line:rgba(255,255,255,.55);
  --ball:#dcf23f; --ball-ink:#1d2a06; --live:#fe1359; --win:#0b8a57; --win-bg:#e3f5ec; --warn:#b26a00;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(14,28,50,.06),0 6px 18px rgba(14,28,50,.06);
  --tabbar:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#08111f; --surface:#101c30; --surface-2:#15233b; --ink:#e8eef8; --muted:#94a4bc; --hair:#22324d;
    --court:#1f63c2; --court-deep:#0f3470; --court-ink:#ffffff; --line:rgba(255,255,255,.45);
    --ball:#dcf23f; --ball-ink:#1d2a06; --live:#ff3b74; --win:#3fd18f; --win-bg:#0f2e22; --warn:#f0a63a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 12px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-stretch:75%;font-weight:800}

/* ---------- Bandeau ---------- */
.hero{position:relative;overflow:hidden;color:var(--court-ink);
  background:radial-gradient(120% 90% at 85% 0%,rgba(255,255,255,.14),transparent 55%),linear-gradient(160deg,var(--court) 0%,var(--court-deep) 100%);
  padding-top:env(safe-area-inset-top,0px)}
.hero .courtlines{position:absolute;right:-40px;top:8px;width:340px;max-width:80%;opacity:.28;pointer-events:none}
.hero .wrap{position:relative;padding-block:18px 16px;display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:16px;background:#fff;flex:none;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-style:italic;font-stretch:80%;font-size:clamp(30px,8.5vw,40px);line-height:.95;letter-spacing:-.01em;text-wrap:balance}
.brand h1 b{color:var(--ball);font-weight:900}
.brand p{margin:4px 0 0;font-size:13.5px;opacity:.9}
.share{margin-left:auto;align-self:flex-start;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.status{display:flex;align-items:center;gap:12px;background:rgba(5,20,45,.32);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px)}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--ball);flex:none}
.status.live .dot{background:var(--live);box-shadow:0 0 0 0 rgba(254,19,89,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(254,19,89,0)}100%{box-shadow:0 0 0 0 rgba(254,19,89,0)}}
.status .t1{font-weight:700;font-size:15px;line-height:1.2}
.status .t2{font-size:12.5px;opacity:.85}
.status .clock{margin-left:auto;text-align:right;font-size:26px;line-height:1;color:var(--ball)}
.status .clock small{display:block;font:600 10.5px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:.75}
.facts{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.facts span{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-weight:600}

/* ---------- Vues ---------- */
main{padding-block:14px 8px}
.view[hidden]{display:none}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 10px}
.section-title h2{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:22px;letter-spacing:-.005em}
.section-title .aside{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}

/* Recherche de nom */
.finder{position:relative;margin:2px 0 10px}
.finder .ficon{position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.finder input{width:100%;border:1.5px solid var(--hair);background:var(--surface);border-radius:14px;padding:13px 14px 13px 44px;font-size:16px;box-shadow:var(--shadow)}
.finder input:focus{border-color:var(--court);outline:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:8;background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:0 12px 32px rgba(14,28,50,.18);max-height:min(55vh,360px);overflow:auto;padding:6px}
.results button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:12px;font-weight:600;font-size:15.5px;min-height:46px}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results .nores{margin:0;padding:12px;color:var(--muted);font-size:14px}
.mine{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:10px 12px 12px;margin-bottom:6px}
.mine-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.mine-head .linkbtn{padding:4px 0}
.mine-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 2px;scroll-padding-inline:2px}
.mine-chips::-webkit-scrollbar{display:none}
.mchip{flex:none;display:grid;justify-items:start;gap:1px;border:1px solid transparent;background:var(--ball);color:var(--ball-ink);border-radius:12px;padding:7px 10px;text-align:left}
.mchip b{font-family:var(--f-display);font-stretch:80%;font-size:16px;line-height:1.1}
.mchip span{font-size:11.5px;font-weight:600}
.mchip em{font-style:normal;font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:15px}
.mchip.done{background:var(--surface-2);color:var(--muted);border-color:var(--hair)}
.mchip.live{background:var(--live);color:#fff}
.mchip.sel{background:var(--court);color:#fff;border-color:var(--court)}

/* Remplacements */
.rtag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;text-decoration:none;border-radius:4px;padding:0 4px;vertical-align:2px;background:var(--court);color:#fff}
.subs{margin-top:14px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:14px}
.subs-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.subs-head h3{margin:0;font-family:var(--f-display);font-stretch:85%;font-size:18px}
.subs-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sublist{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--hair);display:grid;gap:6px;font-size:14px}
.sublist li{display:flex;align-items:center;justify-content:space-between;gap:10px}
.form{display:grid;gap:6px;margin-bottom:12px}
.form label{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
.form select,.form input{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;width:100%}

/* Vote */
.awards-hero{border-radius:18px;color:#fff;padding:16px;margin:4px 0 12px;background:linear-gradient(160deg,var(--court),var(--court-deep))}
.awards-hero .lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ball)}
.awards-hero h2{margin:4px 0 4px;font-family:var(--f-display);font-weight:900;font-style:italic;font-stretch:80%;font-size:28px;line-height:1.05}
.awards-hero p{margin:0;font-size:14px;opacity:.9}
.rules{margin:0 0 12px;padding:12px 14px 12px 30px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);font-size:13.5px;display:grid;gap:3px}
.vcard{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:14px;margin-bottom:10px;display:grid;gap:8px}
.vcard label{font-weight:700}
.vcard select,.vcard textarea,.orgrow input{width:100%;border:1px solid var(--hair);background:var(--surface-2);border-radius:12px;padding:12px;font-size:16px;font:inherit}
.vcard.voter{border-color:var(--court)}
.vhead{display:flex;gap:12px;align-items:flex-start}
.ve{font-size:28px;line-height:1}
.vhead h3{margin:0;font-family:var(--f-display);font-stretch:85%;font-size:19px;line-height:1.15}
.vq{margin:2px 0 0;color:var(--muted);font-size:13.5px;font-style:italic}
.vdesc summary{cursor:pointer;color:var(--court);font-weight:600;font-size:13.5px}
.vdesc p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.voted{background:var(--win-bg);border:1px solid var(--hair);border-radius:var(--r);padding:16px;margin-bottom:12px}
.voted .big{font-family:var(--f-display);font-weight:900;font-style:italic;font-stretch:80%;font-size:26px;color:var(--win)}
.voted p{margin:4px 0 0}
.vlock{margin-top:14px;background:var(--surface);border:1px dashed var(--hair);border-radius:var(--r);padding:16px;text-align:center}
.vlock h3{margin:0;font-family:var(--f-display);font-stretch:85%;font-size:20px}
.vlock p{margin:4px 0 0;color:var(--muted)}
.org{margin-top:12px;text-align:left}
.org summary{cursor:pointer;font-size:13px;color:var(--muted);text-align:center}
.orgrow{display:flex;gap:8px;margin-top:8px}
.winner{margin:2px 0 0;font-weight:800;color:var(--win)}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 28px;gap:8px;align-items:center;font-size:13.5px}
.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bt i{display:block;height:100%;background:var(--court);border-radius:5px}
.bv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rems{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
@media (prefers-color-scheme: dark){ .vdesc summary{color:#9cc2ff} }

/* Bandeau des tours */
.tours{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--hair)}
.tour-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding-bottom:2px}
.tour-strip::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:center;flex:none;min-width:58px;border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:6px 8px 5px;text-align:center;display:grid;gap:1px;position:relative}
.chip .n{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:17px;line-height:1.1}
.chip .h{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.past{background:var(--surface-2)}
.chip.past .n{color:var(--muted)}
.chip.full::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--win)}
.chip.live{border-color:var(--live)}
.chip.live .h{color:var(--live);font-weight:700}
.chip.sel{background:var(--court);border-color:var(--court);color:#fff}
.chip.sel .h,.chip.sel .n{color:#fff}

.tour-head{display:flex;align-items:center;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.tour-head h2{margin:0;font-family:var(--f-display);font-weight:900;font-style:italic;font-stretch:80%;font-size:30px;line-height:1}
.tour-head .when{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;letter-spacing:.02em}
.pill.live{background:var(--live);color:#fff}
.pill.done{background:var(--surface-2);color:var(--muted);border:1px solid var(--hair)}
.pill.next{background:var(--ball);color:var(--ball-ink)}
.pill.change{background:var(--surface-2);color:var(--warn);border:1px solid var(--hair)}

/* Carte de match */
.matches{display:grid;gap:12px}
.match{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--hair)}
.match header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--hair)}
.court-tag{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.court-tag svg{width:28px;height:15px;flex:none}
.match header .when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.team{display:flex;align-items:center;gap:12px;padding:10px 14px}
.team + .team{border-top:1px dashed var(--hair)}
.names{display:grid;gap:1px;min-width:0;flex:1}
.names span{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.names span.me{background:var(--ball);color:var(--ball-ink);border-radius:6px;padding:0 6px;margin-left:-6px;width:fit-content;max-width:100%}
.score{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:34px;line-height:1;min-width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.team.win .score{color:var(--win)}
.team.win .names span:not(.me){color:var(--ink)}
.team.lose .names span:not(.me){color:var(--muted)}
.score.none{font-size:24px;color:var(--muted);opacity:.5}
.match footer{display:flex;align-items:center;gap:10px;padding:10px 14px 12px;border-top:1px solid var(--hair)}
.match footer .meta{font-size:12.5px;color:var(--muted);flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--court);color:#fff}
.btn.ball{background:var(--ball);color:var(--ball-ink)}
.btn.ghost{background:transparent;color:var(--court);border:1px solid var(--hair)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
@media (prefers-color-scheme: dark){ .btn.ghost{color:#9cc2ff} }

details.rest{margin-top:14px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:0 14px}
details.rest summary{list-style:none;padding:12px 0;font-weight:600;display:flex;justify-content:space-between;cursor:pointer}
details.rest summary::-webkit-details-marker{display:none}
details.rest summary::after{content:"Voir";color:var(--court);font-size:13px}
details.rest[open] summary::after{content:"Masquer"}
.restlist{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 14px}
.restlist span{font-size:13px;background:var(--surface-2);border:1px solid var(--hair);border-radius:999px;padding:3px 10px}
.restlist span.me{background:var(--ball);color:var(--ball-ink);border-color:transparent;font-weight:700}

/* ---------- Mes matchs ---------- */
.picker{display:grid;gap:10px}
.search{width:100%;border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.namegrid button{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:12px;text-align:left;font-weight:600;min-height:48px}
.hello{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.hello h2{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:24px}
.linkbtn{background:none;border:0;color:var(--court);font-weight:600;font-size:14px;padding:8px 0}
@media (prefers-color-scheme: dark){ .linkbtn{color:#9cc2ff} }
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:10px 8px;text-align:center}
.stat .v{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.nextcard{margin-top:12px;border-radius:18px;color:#fff;padding:16px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--court),var(--court-deep))}
.nextcard .courtlines{position:absolute;right:-30px;bottom:-12px;width:220px;opacity:.22}
.nextcard .lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ball)}
.nextcard .big{font-family:var(--f-display);font-weight:900;font-style:italic;font-stretch:80%;font-size:30px;line-height:1.05;margin:4px 0 8px}
.nextcard .row{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14.5px;position:relative}
.nextcard .row dt{opacity:.75}
.nextcard .row dd{margin:0;font-weight:600}
.timeline{display:grid;gap:10px;margin-top:6px}
.tl{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:12px}
.tl .tt{text-align:center}
.tl .tt .n{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:20px;line-height:1}
.tl .tt .h{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .who{min-width:0;font-size:14px}
.tl .who b{font-weight:700}
.tl .who .vs{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{display:grid;justify-items:end;gap:3px}
.res .sc{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.badge{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.badge.v{background:var(--win-bg);color:var(--win)}
.badge.d{background:var(--surface-2);color:var(--muted)}
.badge.n{background:var(--surface-2);color:var(--warn)}
.badge.live{background:var(--live);color:#fff}
.tl .go{border:1px solid var(--hair);background:var(--surface-2);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;color:var(--court)}
@media (prefers-color-scheme: dark){ .tl .go{color:#9cc2ff} }

/* ---------- Classement ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:14px}
.pod{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 8px;text-align:center;min-width:0}
.pod .rk{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:26px;line-height:1}
.pod .nm{font-weight:700;font-size:13.5px;line-height:1.2;margin:6px 0 2px;overflow-wrap:anywhere}
.pod .mv{font-size:12px;color:var(--muted)}
.pod.p1{background:linear-gradient(170deg,var(--court),var(--court-deep));color:#fff;border-color:transparent;padding-block:18px}
.pod.p1 .rk{color:var(--ball);font-size:34px}
.pod.p1 .mv{color:#fff;opacity:.8}
.ranking{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}

<script>
"use strict";
const { REST, KEY, store, esc } = FP;
const CL = window.FunPadelClassement;
const API = REST + "fun_padel_scores";
const REMP = REST + "fun_padel_remplacements";
const RPC = REST + "rpc/";
const VOTES = REST + "fun_padel_votes";
const MIN = 60000;

/* ---------- Tournoi chargé depuis la base ---------- */
let T = null;                       // ligne du tournoi
let P = [], M = [], NT = 0, SLOT = 14, PLAY = 12, START_MIN = 840, T0 = 0, TZ = "Indian/Mauritius", CIBLE = 25;
let CATS = [], RESULTS_AT = null, VOTE_ON = false, REGLES = {};
let started = false;
const K = n => `fp${T ? T.id : 0}_${n}`;   // clés de stockage propres à chaque tournoi

function applyTournament(row) {
  const prevId = T ? T.id : null;
  T = row;
  const c = row.config || {};
  P = c.joueurs || []; M = (c.matchs || []).slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  NT = M.length ? Math.max(...M.map(m => m[0])) : (c.tours || 0);
  SLOT = c.creneau || 14; PLAY = c.jeu || 12; TZ = c.fuseau || "Indian/Mauritius";
  CIBLE = c.score_cible === 0 ? 0 : (c.score_cible || 25);
  const [h, mi] = String(c.debut || "14:00").split(":").map(Number); START_MIN = h * 60 + mi;
  T0 = FP.versUtc(c.date || row.jour, c.debut || "14:00", TZ);
  REGLES = c.classement || {};
  VOTE_ON = !!(c.vote && c.vote.actif && (c.vote.categories || []).length);
  CATS = VOTE_ON ? c.vote.categories : [];
  RESULTS_AT = VOTE_ON && c.vote.resultats_a ? Date.parse(c.vote.resultats_a) : null;
  if (prevId !== T.id) loadLocal();
  if (ballot.c.length !== CATS.length) ballot.c = CATS.map((_, k) => ballot.c[k] || "");
  if (!VOTE_ON && tab === "vote") tab = "matchs";
  document.title = c.nom || row.nom || "Fun Padel";
  renderHeader();
}
function loadLocal() {
  rows = store.get(K("rows"), []); repRows = store.get(K("reps"), []); me = store.get(K("me"), null);
  if (me !== null && (me < 0 || me >= P.length)) me = null;
  lastSync = store.get(K("sync"), 0); voted = store.get(K("voted"), null);
  photos = store.get(K("photos"), []); myPhotos = store.get(K("myphotos"), []);
  selTour = null; rebuild();
}
const writable = () => T && (T.statut === "publie" || (T.statut === "brouillon" && isAdmin()));
const isAdmin = () => !!FP.session();

/* ---------- Utilitaires ---------- */
const $ = (s, el = document) => el.querySelector(s);
const hm = FP.hm;
const startMin = t => START_MIN + SLOT * (t - 1);
const tourLabel = t => `${hm(startMin(t))} – ${hm(startMin(t) + PLAY)}`;
const clockMu = ms => FP.heure(ms, TZ);
const matchesOfTour = t => M.map((m, i) => i).filter(i => M[i][0] === t);
const playersOf = i => M[i].slice(2);
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;
const nbTerrains = () => M.length ? Math.max(...M.map(m => m[1])) : ((T && T.config.terrains) || 0);

function renderHeader() {
  const c = T.config || {}, nom = (c.nom || T.nom || "Fun Padel").trim();
  const mots = nom.split(/\s+/), last = mots.length > 1 ? mots.pop() : null;
  $("#t-nom").innerHTML = last ? `${esc(mots.join(" "))} <b>${esc(last)}</b>` : `<b>${esc(nom)}</b>`;
  const d = FP.dateLongue(c.date || T.jour);
  $("#t-sous").textContent = [c.club, d].filter(Boolean).join(" · ");
  const facts = [];
  if (M.length) facts.push(`${hm(START_MIN)} – ${hm(startMin(NT) + PLAY)}`);
  facts.push(plural(nbTerrains(), "terrain"), plural(P.length, "joueur"), CIBLE ? `Matchs en ${CIBLE} points` : "Score libre");
  $("#facts").innerHTML = facts.map(f => `<span>${esc(f)}</span>`).join("");
  document.body.style.setProperty("--ntabs", VOTE_ON ? 5 : 4);
  const vt = document.querySelector('.tab[data-tab="vote"]'); if (vt) vt.hidden = !VOTE_ON;
  const b = $("#banner");
  b.innerHTML = T.statut === "brouillon" ? `<div class="banner draft">Brouillon : visible seulement par les organisateurs connectés. <a href="admin.html">Ouvrir l'admin</a></div>`
    : T.statut === "archive" ? `<div class="banner archive">Tournoi terminé et archivé : consultation seulement.</div>` : "";
}

/* ---------- État ---------- */
let rows = [];
let scores = {};               // index match -> {a, b, by, at}
let me = null;
let tab = "matchs";
let selTour = null;
let lastSync = 0;
let online = true;
let restOpen = false;
let repRows = [];
let reps = {};                 // joueur -> {name, from, by, at}

function rebuild() {
  scores = {};
  for (const r of rows) {
    if (r.match >= M.length) continue;
    if (r.score_a === null || r.score_b === null) delete scores[r.match];
    else scores[r.match] = { a: r.score_a, b: r.score_b, by: r.saisi_par || "", at: Date.parse(r.created_at) };
  }
  reps = {};
  for (const r of repRows) {
    if (r.joueur >= P.length) continue;
    if (!r.remplacant) delete reps[r.joueur];
    else reps[r.joueur] = { name: r.remplacant, from: r.a_partir_du_tour, by: r.saisi_par || "", at: Date.parse(r.created_at) };
  }
}

/* ---------- Noms et remplacements ---------- */
const nameAt = (p, t) => (reps[p] && t >= reps[p].from) ? reps[p].name : P[p];
const isRep = (p, t) => !!(reps[p] && t >= reps[p].from);
const nowTour = () => phase().tour;
const meName = () => me === null ? null : nameAt(me, nowTour());
const properName = s => s.trim().replace(/\s+/g, " ").toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (x, a, b) => a + b.toUpperCase());

/* ---------- Horloge du tournoi ---------- */
function phase(now = Date.now()) {
  if (!NT) return { kind: "pre", tour: 1, inMin: (T0 - now) / MIN };
  const d = (now - T0) / MIN;
  if (d < 0) return { kind: "pre", tour: 1, inMin: -d };
  const i = Math.floor(d / SLOT), into = d - i * SLOT;
  if (i >= NT || (i === NT - 1 && into >= PLAY)) return { kind: "done", tour: NT };
  if (into < PLAY) return { kind: "live", tour: i + 1, left: PLAY - into };
  return { kind: "change", tour: i + 2, left: SLOT - into };
}
function tourState(t, now = Date.now()) {
  const s = T0 + (t - 1) * SLOT * MIN, e = s + PLAY * MIN;
  if (now >= e) return "done";
  if (now >= s) return "live";
  return "next";
}
const fmtLeft = m => m >= 48 * 60 ? `${Math.round(m / 1440)} jours` : m >= 60 ? `${Math.floor(m / 60)} h ${String(Math.floor(m % 60)).padStart(2, "0")}` : `${Math.max(1, Math.ceil(m))} min`;

function renderStatus() {
  const el = $("#status"); if (!T || !NT) { el.hidden = true; return; }
  el.hidden = false;
  const p = phase();
  el.className = "status" + (p.kind === "live" ? " live" : "");
  let t1, t2, clock = "", cap = "";
  if (p.kind === "pre") { t1 = `Premier match à ${hm(START_MIN)}`; t2 = `Tour 1 sur ${NT} · consultez « Mes matchs »`; clock = fmtLeft(p.inMin); cap = "avant le début"; }
  else if (p.kind === "live") { t1 = `Tour ${p.tour} en cours`; t2 = `Fin du jeu à ${hm(startMin(p.tour) + PLAY)} · tour ${p.tour} sur ${NT}`; clock = `${Math.ceil(p.left)}′`; cap = "restantes"; }
  else if (p.kind === "change") { t1 = "Changement de terrain"; t2 = `Tour ${p.tour} à ${hm(startMin(p.tour))}`; clock = `${Math.ceil(p.left)}′`; cap = "avant reprise"; }
  else { t1 = "Tournoi terminé"; t2 = "Bravo à tous les joueurs !"; }
  el.innerHTML = `<span class="dot"></span><div><div class="t1">${t1}</div><div class="t2">${t2}</div></div>` +
    (clock ? `<div class="clock num">${clock}<small>${cap}</small></div>` : "");
}

/* ---------- Statistiques et classement ---------- */
function computeStats() { return CL.calculer({ P, M, scores, nomA: nameAt, regles: REGLES }); }

/* ---------- Vue Matchs ---------- */
function nameSpan(p, t) {
  const r = isRep(p, t);
  return `<span class="${p === me ? "me" : ""}">${esc(nameAt(p, t))}${r ? `<abbr class="rtag" title="Remplace ${esc(P[p])}">R</abbr>` : ""}</span>`;
}
function matchCard(i, opts = {}) {
  const m = M[i], s = scores[i], ts = tourState(m[0]);
  const aWin = s && s.a > s.b, bWin = s && s.b > s.a;
  const cls = w => s ? (w ? " win" : (s.a === s.b ? "" : " lose")) : "";
  const sc = v => s ? `<div class="score">${v}</div>` : `<div class="score none">–</div>`;
  const meta = s ? `Saisi${s.by ? " par " + esc(s.by) : ""} à ${clockMu(s.at)}` :
    (ts === "live" ? "Match en cours" : ts === "done" ? "Score pas encore saisi" : `Début à ${hm(startMin(m[0]))}`);
  const btn = !writable() ? "" : s ? `<button class="btn ghost" data-enter="${i}" type="button">Corriger</button>`
               : `<button class="btn ${ts === "next" ? "ghost" : "primary"}" data-enter="${i}" type="button">Saisir le score</button>`;
  return `<article class="match">
    <header><span class="court-tag"><svg aria-hidden="true" style="color:var(--court)"><use href="#court"/></svg>Terrain ${m[1]}</span>
      <span class="when">${opts.showTour ? `Tour ${m[0]} · ` : ""}${hm(startMin(m[0]))}</span></header>
    <div class="team${cls(aWin)}"><div class="names">${nameSpan(m[2], m[0])}${nameSpan(m[3], m[0])}</div>${sc(s && s.a)}</div>
    <div class="team${cls(bWin)}"><div class="names">${nameSpan(m[4], m[0])}${nameSpan(m[5], m[0])}</div>${sc(s && s.b)}</div>
    <footer><span class="meta">${meta}</span>${btn}</footer>
  </article>`;
}
function renderMatchs() {
  const v = $("#view-matchs");
  if (!M.length) { v.innerHTML = `<div class="empty"><h3>Planning pas encore publié</h3><p>Les organisateurs préparent les matchs. Revenez un peu plus tard.</p></div>`; return; }
  const p = phase();
  if (selTour === null || selTour > NT) selTour = Math.min(p.tour, NT);
  const chips = Array.from({ length: NT }, (_, k) => {
    const t = k + 1, st = tourState(t), full = matchesOfTour(t).every(i => scores[i]);
    const cls = ["chip", st === "done" ? "past" : "", st === "live" ? "live" : "", full ? "full" : "", t === selTour ? "sel" : ""].join(" ");
    return `<button class="${cls}" data-tour="${t}" type="button" aria-pressed="${t === selTour}"><span class="n">T${t}</span><span class="h">${st === "live" ? "en jeu" : hm(startMin(t))}</span></button>`;
  }).join("");
  const st = tourState(selTour);
  const pill = st === "live" ? `<span class="pill live">● En jeu</span>` :
    st === "done" ? `<span class="pill done">Terminé</span>` :
    (p.kind === "change" && p.tour === selTour) || (p.kind === "pre" && selTour === 1) ? `<span class="pill next">Prochain tour</span>` : `<span class="pill done">À venir</span>`;
  const ids = matchesOfTour(selTour), playing = new Set(ids.flatMap(playersOf));
  const rest = P.map((n, id) => id).filter(id => !playing.has(id)).sort((a, b) => nameAt(a, selTour).localeCompare(nameAt(b, selTour), "fr"));
  const active = Object.keys(reps).map(Number).sort((a, b) => P[a].localeCompare(P[b], "fr"));
  v.innerHTML = `
    ${finderHtml()}
    <div class="tours"><div class="tour-strip" id="strip">${chips}</div></div>
    <div class="tour-head"><h2>Tour ${selTour}</h2><span class="when">${tourLabel(selTour)}</span>${pill}</div>
    <div class="matches">${ids.map(i => matchCard(i)).join("")}</div>
    ${rest.length ? `<details class="rest"${restOpen ? " open" : ""}><summary>Au repos pendant ce tour (${rest.length})</summary>
      <div class="restlist">${rest.map(id => `<span class="${id === me ? "me" : ""}">${esc(nameAt(id, selTour))}</span>`).join("")}</div></details>` : ""}
    ${writable() ? `<section class="subs" aria-labelledby="subs-t">
      <div class="subs-head"><div><h3 id="subs-t">Un joueur absent ?</h3><p>Remplacez-le à partir d'un tour, ses matchs passent au remplaçant.</p></div>
      <button class="btn ball" type="button" data-sub>Remplacer</button></div>
      ${active.length ? `<ul class="sublist">${active.map(p => `<li><span><b>${esc(reps[p].name)}</b> remplace ${esc(P[p])} dès le tour ${reps[p].from}</span>
        <button class="linkbtn" type="button" data-unsub="${p}">Annuler</button></li>`).join("")}</ul>` : ""}
    </section>` : ""}`;
  const det = $("#view-matchs details.rest"); if (det) det.addEventListener("toggle", e => { restOpen = e.target.open; });
  bindFinder();
  const sel = $("#strip .sel");
  if (sel) sel.scrollIntoView({ block: "nearest", inline: "center" });
}

/* ---------- Recherche de son nom (accueil) ---------- */
let findQ = "", findFocus = false;
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function finderHtml() {
  let mine = "";
  if (me !== null) {
    const my = M.map((m, i) => i).filter(i => playersOf(i).includes(me));
    mine = `<div class="mine"><div class="mine-head"><span>Matchs de <b>${esc(meName())}</b></span>
      <button class="linkbtn" type="button" data-unme>Effacer</button></div>
      <div class="mine-chips">${my.map(i => {
        const m = M[i], st = tourState(m[0]), s = scores[i];
        return `<button type="button" class="mchip ${st}${m[0] === selTour ? " sel" : ""}" data-tour="${m[0]}"><b>T${m[0]}</b><span>${hm(startMin(m[0]))} · Terrain ${m[1]}</span>${s ? `<em>${s.a}-${s.b}</em>` : ""}</button>`;
      }).join("")}</div></div>`;
  }
  return `<div class="finder" role="search">
    <svg class="ficon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="find" type="search" placeholder="${me === null ? "Recherchez votre nom" : "Rechercher un autre joueur"}" autocomplete="off" enterkeyhint="search" aria-label="Rechercher un joueur" value="${esc(findQ)}">
    <div class="results" id="find-results" role="listbox" hidden></div>
  </div>${mine}`;
}
function renderFindResults() {
  const box = $("#find-results"); if (!box) return;
  const q = fold(findQ.trim());
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  const pool = P.map((n, id) => ({ n, id })).concat(Object.keys(reps).map(k => ({ n: reps[k].name, id: Number(k) })));
  const hits = pool.filter(x => fold(x.n).includes(q)).sort((a, b) => a.n.localeCompare(b.n, "fr"));
  box.innerHTML = hits.length ? hits.map(x => `<button type="button" role="option" data-pick="${x.id}">${esc(x.n)}</button>`).join("")
    : `<p class="nores">Aucun joueur ne correspond à « ${esc(findQ.trim())} »</p>`;
  box.hidden = false;
}
function bindFinder() {
  const inp = $("#find"); if (!inp) return;
  inp.addEventListener("input", () => { findQ = inp.value; renderFindResults(); });
  inp.addEventListener("focus", () => { findFocus = true; });
  inp.addEventListener("blur", () => { findFocus = false; });
  if (findQ) renderFindResults();
  if (findFocus) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}
function pick(id) {
  me = id; store.set(K("me"), me); findQ = ""; findFocus = false;
  const next = M.map((m, i) => i).filter(i => playersOf(i).includes(me)).find(i => tourState(M[i][0]) !== "done");
  selTour = next !== undefined ? M[next][0] : selTour;
  if (document.activeElement) document.activeElement.blur();
  renderMatchs(); toast(`Vos matchs sont surlignés en jaune`);
}

/* ---------- Vue Mes matchs ---------- */
function renderMoi() {
  const v = $("#view-moi");
  if (me === null) {
    v.innerHTML = `<div class="section-title"><h2>Qui êtes-vous ?</h2><span class="aside">Choix gardé sur ce téléphone</span></div>
      <div class="picker"><input class="search" id="who" type="search" placeholder="Tapez votre prénom" autocomplete="off" aria-label="Rechercher votre nom">
      <div class="namegrid" id="names"></div></div>`;
    const list = () => {
      const q = fold($("#who").value || "");
      $("#names").innerHTML = P.map((n, id) => ({ n, id })).concat(Object.keys(reps).map(k => ({ n: reps[k].name, id: Number(k) }))).sort((a, b) => a.n.localeCompare(b.n, "fr"))
        .filter(x => fold(x.n).includes(q))
        .map(x => `<button type="button" data-me="${x.id}">${esc(x.n)}</button>`).join("");
    };
    list(); $("#who").addEventListener("input", list);
    return;
  }
  const st = computeStats(), { byName, ranked } = st, myN = meName(), mine = byName.get(myN), r = ranked.find(x => x.name === myN);
  const my = M.map((m, i) => i).filter(i => playersOf(i).includes(me));
  const now = Date.now();
  const next = my.find(i => tourState(M[i][0], now) !== "done");
  let nextHtml = "";
  if (next !== undefined) {
    const m = M[next], onA = m[2] === me || m[3] === me;
    const partner = onA ? (m[2] === me ? m[3] : m[2]) : (m[4] === me ? m[5] : m[4]);
    const opp = onA ? [m[4], m[5]] : [m[2], m[3]];
    const startMs = T0 + (m[0] - 1) * SLOT * MIN, live = tourState(m[0], now) === "live";
    const when = live ? "En jeu maintenant" : `Dans ${fmtLeft((startMs - now) / MIN)}`;
    nextHtml = `<div class="nextcard"><svg class="courtlines" viewBox="0 0 200 100" aria-hidden="true" style="color:#fff"><use href="#court"/></svg>
      <div class="lbl">${live ? "● Match en cours" : "Prochain match"}</div>
      <div class="big">Terrain ${m[1]} · ${hm(startMin(m[0]))}</div>
      <dl class="row"><dt>Tour</dt><dd>${m[0]} sur ${NT} · ${when}</dd><dt>Partenaire</dt><dd>${esc(nameAt(partner, m[0]))}</dd><dt>Adversaires</dt><dd>${esc(nameAt(opp[0], m[0]))} et ${esc(nameAt(opp[1], m[0]))}</dd></dl></div>`;
  } else {
    nextHtml = `<div class="nextcard"><div class="lbl">Vos matchs</div><div class="big">Tous joués, bravo !</div></div>`;
  }
  const tl = my.map(i => {
    const m = M[i], onA = m[2] === me || m[3] === me;
    const partner = onA ? (m[2] === me ? m[3] : m[2]) : (m[4] === me ? m[5] : m[4]);
    const opp = onA ? [m[4], m[5]] : [m[2], m[3]];
    const s = scores[i], ts = tourState(m[0], now);
    let res;
    if (s) {
      const f = onA ? s.a : s.b, c = onA ? s.b : s.a;
      const b = f > c ? `<span class="badge v">VICTOIRE</span>` : f < c ? `<span class="badge d">DÉFAITE</span>` : `<span class="badge n">NUL</span>`;
      res = `<div class="res"><span class="sc">${f}-${c}</span>${b}</div>`;
    } else if (ts === "next" || !writable()) res = `<div class="res"><span class="badge d">${ts === "next" ? "À VENIR" : "SANS SCORE"}</span></div>`;
    else res = `<button class="go" type="button" data-enter="${i}">${ts === "live" ? "En jeu" : "Saisir"}</button>`;
    return `<div class="tl"><div class="tt"><div class="n">T${m[0]}</div><div class="h">${hm(startMin(m[0]))}</div></div>
      <div class="who"><div>Terrain ${m[1]} · avec <b>${esc(nameAt(partner, m[0]))}</b>${isRep(me, m[0]) ? ` <span class="badge n">${esc(nameAt(me, m[0]))} joue</span>` : ""}</div><div class="vs">contre ${esc(nameAt(opp[0], m[0]))} et ${esc(nameAt(opp[1], m[0]))}</div></div>${res}</div>`;
  }).join("");
  const R = st.regles, lbl = st.moyenne ? "Moyenne" : (R.mode === "victoires" ? "Victoires" : R.mode === "bonus" ? "Total" : "Points");
  const val = r ? CL.format(r, st.moyenne) : "0";
  const fourth = R.mode === "victoires" ? { v: (mine.diff > 0 ? "+" : "") + mine.diff, k: "+/-" } : { v: mine.v, k: "Victoires" };
  v.innerHTML = `<div class="hello"><h2>${esc(myN.split(" ")[0])}</h2><button class="linkbtn" type="button" data-unme>Changer de joueur</button></div>
    <div class="stats">
      <div class="stat"><div class="v">${r ? r.rank : "–"}</div><div class="k">Rang</div></div>
      <div class="stat"><div class="v">${val}</div><div class="k">${lbl}</div></div>
      <div class="stat"><div class="v">${mine.j}/${mine.planned}</div><div class="k">Joués</div></div>
      <div class="stat"><div class="v">${fourth.v}</div><div class="k">${fourth.k}</div></div>
    </div>
    ${nextHtml}
    <div class="section-title"><h2>Mes ${mine.planned} matchs</h2><span class="aside">${mine.pts} points marqués</span></div>
    <div class="timeline">${tl}</div>`;
}

/* ---------- Vue Classement ---------- */
function renderClassement() {
  const st = computeStats(), { ranked, waiting } = st, v = $("#view-classement");
  const n = Object.keys(scores).length, tot = M.length;
  if (!ranked.length) {
    v.innerHTML = `<div class="section-title"><h2>Classement</h2><span class="aside">0 match sur ${tot}</span></div>
      <div class="empty"><svg width="44" height="22" aria-hidden="true" style="color:var(--court)"><use href="#court"/></svg>
      <h3>Le classement démarre au premier score</h3><p>Après chaque match, un joueur saisit le score depuis l'onglet Matchs. Le classement se met à jour tout seul.</p></div>
      <p class="note">${esc(CL.expliquer(REGLES, CIBLE, st.moyenne))}</p>`;
    return;
  }
  const unit = CL.unite(st.regles, st.moyenne);
  const pod = ranked.slice(0, 3);
  const podHtml = pod.length === 3 ? `<div class="podium">${[1, 0, 2].map(k => {
    const x = pod[k];
    return `<div class="pod p${k + 1}"><div class="rk">${x.rank}</div><div class="nm">${esc(x.name)}</div><div class="mv">${CL.format(x, st.moyenne)} ${esc(unit)}</div></div>`;
  }).join("")}</div>` : "";
  const myN = meName();
  const row = x => `<div class="rrow${x.name === myN ? " me" : ""}"><span class="rk">${x.rank}${x.exaequo ? "=" : ""}</span><span class="nm">${esc(x.name)}</span>
    <span class="c">${x.j}</span><span class="c">${x.v}</span><span class="c">${x.diff > 0 ? "+" : ""}${x.diff}</span><span class="tot">${CL.format(x, st.moyenne)}</span></div>`;
  const wrow = x => `<div class="rrow wait${x.name === myN ? " me" : ""}"><span class="rk">–</span><span class="nm">${esc(x.name)}</span><span class="c">0</span><span class="c">–</span><span class="c">–</span><span class="tot">–</span></div>`;
  v.innerHTML = `<div class="section-title"><h2>Classement</h2><span class="aside">${n} match${n > 1 ? "s" : ""} sur ${tot}</span></div>
    ${podHtml}
    <div class="ranking"><div class="rrow head"><span>#</span><span>Joueur</span><span class="c">J</span><span class="c">V</span><span class="c">+/-</span><span style="text-align:right">${esc(CL.entete(st.regles, st.moyenne))}</span></div>
    ${ranked.map(row).join("")}${waiting.map(wrow).join("")}</div>
    <p class="note">${esc(CL.expliquer(REGLES, CIBLE, st.moyenne))} J = matchs joués, V = victoires, +/- = différence de points.</p>`;
}

/* ---------- Saisie du score ---------- */
let sheetMatch = null;
const MAXS = () => Math.min(99, CIBLE ? CIBLE + 15 : 99);
function openSheet(i) {
  if (!writable()) return;
  sheetMatch = i;
  const m = M[i], s = scores[i];
  const hist = rows.filter(r => r.match === i).reverse();
  const team = (a, b, id, v) => `<div class="sline"><div class="names">${nameSpan(a, m[0])}${nameSpan(b, m[0])}</div>
    <div class="stepper"><button type="button" data-step="${id}" data-d="-1" aria-label="Moins un point">−</button>
    <input id="${id}" type="number" inputmode="numeric" min="0" max="${MAXS()}" value="${v}" aria-label="Points de ${esc(nameAt(a, m[0]))} et ${esc(nameAt(b, m[0]))}">
    <button type="button" data-step="${id}" data-d="1" aria-label="Plus un point">+</button>
    ${CIBLE ? `<button type="button" class="q25" data-set="${id}" aria-label="Mettre ${CIBLE} points">${CIBLE}</button>` : ""}</div></div>`;
  $("#sheet-root").innerHTML = `<div class="backdrop" id="bd"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="grab"></div>
    <h3 id="sh-t">Tour ${m[0]} · Terrain ${m[1]}</h3>
    <p class="sub">${tourLabel(m[0])} · ${CIBLE ? `match en ${CIBLE} points. Touchez « ${CIBLE} » pour l'équipe gagnante, puis indiquez les points de l'autre équipe.` : "indiquez les points marqués par chaque équipe."}</p>
    ${s ? `<p class="prev">Score actuel ${s.a}-${s.b}${s.by ? ", saisi par " + esc(s.by) : ""} à ${clockMu(s.at)}</p>` : ""}
    ${team(m[2], m[3], "sa", s ? s.a : 0)}
    ${team(m[4], m[5], "sb", s ? s.b : 0)}
    <div class="byline"><label for="by">Saisi par (facultatif)</label><input id="by" type="text" maxlength="60" autocomplete="name" value="${me !== null ? esc(meName()) : ""}" placeholder="Votre prénom"></div>
    <p class="err" id="err"></p>
    <div class="actions"><button class="btn primary block" id="save" type="button">Enregistrer le score</button>
    ${s ? `<button class="btn ghost block" id="clear" type="button">Effacer ce score</button>` : ""}
    <button class="btn ghost block" id="cancel" type="button">Annuler</button></div>
    ${hist.length ? `<div class="hist"><h4>Historique des saisies</h4><ol>${hist.map(r => `<li><span class="num">${r.score_a === null ? "effacé" : r.score_a + "-" + r.score_b}</span> ${r.saisi_par ? "par " + esc(r.saisi_par) : "anonyme"} · ${clockMu(Date.parse(r.created_at))}</li>`).join("")}</ol></div>` : ""}
  </div></div>`;
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  if (uploading) return;
  pendingUrls.forEach(u => URL.revokeObjectURL(u)); pendingUrls = [];
  $("#sheet-root").innerHTML = ""; document.body.style.overflow = ""; sheetMatch = null;
}
async function postJson(url, body) {
  const res = await fetch(url, { method: "POST", headers: await FP.entetes({ "Content-Type": "application/json", Prefer: "return=minimal" }), body: JSON.stringify(body) });
  if (!res.ok) { const e = new Error(String(res.status)); e.status = res.status; throw e; }
  return res;
}
async function saveSheet(clear) {
  const i = sheetMatch, err = $("#err");
  let a = null, b = null;
  if (!clear) {
    a = Number($("#sa").value); b = Number($("#sb").value);
    const mx = MAXS();
    if (!Number.isInteger(a) || !Number.isInteger(b) || a < 0 || b < 0 || a > mx || b > mx) { err.textContent = `Entrez deux nombres entiers entre 0 et ${mx}.`; return; }
    if (a === 0 && b === 0) { err.textContent = "Le score est à 0-0. Indiquez les points de chaque équipe."; return; }
  }
  const by = $("#by").value.trim().slice(0, 60);
  const btn = $(clear ? "#clear" : "#save"); btn.disabled = true; btn.textContent = "Envoi…";
  try {
    await postJson(API, { tournoi: T.id, match: i, score_a: a, score_b: b, saisi_par: by || null });
    rows.push({ match: i, score_a: a, score_b: b, saisi_par: by, created_at: new Date().toISOString() }); rebuild();
    closeSheet(); render(); toast(clear ? "Score effacé" : "Score enregistré, merci !");
    refresh();
  } catch (e) {

async function saveSub() {

  }
}
async function cancelSub(pid) {

// Image tirée de la vidéo (vers 0,5 s), avec ses dimensions et sa durée
function videoThumb(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), v = document.createElement("video");
    let done = false;
    const finish = (blob, w, h) => {
      if (done) return; done = true; clearTimeout(timer);
      const dur = Number.isFinite(v.duration) ? Math.round(v.duration * 10) / 10 : null;
      URL.revokeObjectURL(url); v.removeAttribute("src"); v.load();
      resolve({ blob, w: w || null, h: h || null, dur });
    };
    const fallback = async () => { if (!done) finish(await genericThumb(), v.videoWidth, v.videoHeight); };
    const timer = setTimeout(fallback, 8000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onloadedmetadata = () => { try { v.currentTime = Math.min(0.5, (Number.isFinite(v.duration) ? v.duration : 1) / 2); } catch { fallback(); } };
    v.onseeked = async () => {
      try {
        const w0 = v.videoWidth, h0 = v.videoHeight; if (!w0 || !h0) return fallback();
        const k = Math.min(1, 480 / Math.max(w0, h0)), c = document.createElement("canvas");
        c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        finish(await canvasJpeg(c, 0.74), w0, h0);
      } catch { fallback(); }
    };
    v.onerror = fallback;
    v.src = url;
  });
}
function putFile(path, blob, mime, onProgress) {
  return new Promise((ok, ko) => {
    const x = new XMLHttpRequest();
    x.open("POST", UPLOAD + path);
    x.setRequestHeader("apikey", KEY); x.setRequestHeader("Authorization", `Bearer ${KEY}`);
    x.setRequestHeader("Content-Type", mime); x.setRequestHeader("cache-control", "max-age=86400");
    x.timeout = 600000;
    if (onProgress) x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => x.status >= 200 && x.status < 300 ? ok() : ko(new Error("http " + x.status));
    x.onerror = x.ontimeout = () => ko(new Error("réseau"));
    x.send(blob);
  });
}
// Vidéos : envoi par morceaux de 6 Mo, relancé automatiquement si le réseau coupe
let tusLib = null;
function loadTus() {
  if (window.tus) return Promise.resolve(window.tus);
  if (!tusLib) tusLib = new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js";
    s.onload = () => window.tus ? ok(window.tus) : ko(new Error("tus"));
    s.onerror = () => { tusLib = null; ko(new Error("tus")); };
    document.head.appendChild(s);
  });
  return tusLib;
}
async function putVideo(path, file, mime, onProgress) {
  let tus;
  try { tus = await loadTus(); } catch { return putFile(path, file, mime, onProgress); }
  return new Promise((ok, ko) => {
    new tus.Upload(file, {
      endpoint: TUS, retryDelays: [0, 2000, 5000, 10000, 20000, 30000],
      headers: { authorization: `Bearer ${KEY}`, apikey: KEY, "x-upsert": "false" },
      uploadDataDuringCreation: true, removeFingerprintOnSuccess: true, chunkSize: 6 * 1024 * 1024,
      metadata: { bucketName: "fun-padel-photos", objectName: path, contentType: mime, cacheControl: "86400" },
      onProgress: (a, b) => onProgress && onProgress(a / b),
      onError: e => ko(e), onSuccess: () => ok()
    }).start();
  });
}
async function uploadAll() {
  if (uploading) return;
  const by = ($("#ph-by").value || "").trim().replace(/\s+/g, " ").slice(0, 60), leg = ($("#ph-leg").value || "").trim().slice(0, 140);
  const n = pending.length, prog = $("#ph-prog"), bar = $("#ph-prog i"), lab = $("#ph-prog span"), btn = $("#ph-send");
  uploading = true; btn.disabled = true; btn.textContent = "Envoi en cours…"; $("#cancel").disabled = true; $("#err").textContent = "";
  prog.hidden = false;
  const failed = []; let ok = 0, badFormat = 0;
  for (let k = 0; k < n; k++) {
    const f = pending[k], vid = isVideo(f), u = uuid();
    const step = x => { bar.style.width = `${Math.round(100 * (k + x) / n)}%`; };
    lab.textContent = `Envoi ${k + 1} sur ${n}${vid ? ` · vidéo de ${mo(f.size)}, gardez la page ouverte` : ""}`; step(0);
    try {
      let body;
      if (vid) {
        const meta = videoMeta(f), th = await videoThumb(f);
        await putFile(`t/${u}.jpg`, th.blob, "image/jpeg"); step(0.03);
        await putVideo(`v/${u}.${meta.ext}`, f, meta.mime, x => step(0.03 + 0.94 * x));
        body = { photo: `v/${u}.${meta.ext}`, largeur: th.w, hauteur: th.h, type: "video", duree: th.dur };
      } else {
        const img = await loadImg(f);
        const full = await toJpeg(img, 1920, 0.82), thumb = await toJpeg(img, 480, 0.74);
        await putFile(`t/${u}.jpg`, thumb.blob, "image/jpeg"); step(0.1);
        await putFile(`p/${u}.jpg`, full.blob, "image/jpeg", x => step(0.1 + 0.85 * x));
        body = { photo: `p/${u}.jpg`, largeur: full.w, hauteur: full.h, type: "photo" };
      }
      const res = await fetch(`${PHOTOS}?select=${COLS}`, { method: "POST",
        headers: await FP.entetes({ "Content-Type": "application/json", Prefer: "return=representation" }),
        body: JSON.stringify({ ...body, tournoi: T.id, auteur: by || null, legende: leg || null, vignette: `t/${u}.jpg`, cle: devKey }) });
      if (!res.ok) throw new Error("http " + res.status);
      const [row] = await res.json();
      myPhotos.push(row.id); store.set(K("myphotos"), myPhotos);
      photos = [row, ...photos.filter(p => p.id !== row.id)]; store.set(K("photos"), photos);
      ok++; step(1);
    } catch (e) { failed.push(f); if (e && e.message === "format") badFormat++; }
  }
  uploading = false;
  if (!failed.length) {
    tooBig = [];
    closeSheet(); render(); toast(ok > 1 ? `${ok} fichiers ajoutés à l'album, merci !` : "Ajouté à l'album, merci !"); loadPhotos();
    return;
  }
  pending = failed;
  renderUpload(`${ok ? ok + " envoyé" + (ok > 1 ? "s" : "") + ". " : ""}${failed.length} fichier${failed.length > 1 ? "s" : ""} non envoyé${failed.length > 1 ? "s" : ""}. ` +
    (badFormat ? "Format illisible par ce téléphone : choisissez une photo JPEG." : "Vérifiez votre connexion puis réessayez."));
  if (ok) renderPhotos();
}

/* Visionneuse plein écran */
function openLightbox(id) {
  lbList = photoList().map(p => p.id); lbPos = Math.max(0, lbList.indexOf(id));
  sheetMatch = -3; document.body.style.overflow = "hidden";
  renderLightbox();
}
function renderLightbox() {
  const p = photos.find(x => x.id === lbList[lbPos]);
  if (!p) { closeSheet(); return; }
  const n = lbList.length, vid = p.type === "video", ext = p.photo.split(".").pop();
  const canShare = !vid && !!(navigator.canShare && window.File);
  const canDel = myPhotos.includes(p.id) || isAdmin();
  $("#sheet-root").innerHTML = `<div class="lb" role="dialog" aria-modal="true" aria-label="${vid ? "Vidéo" : "Photo"} ${lbPos + 1} sur ${n}">
    <div class="lb-top"><span>${lbPos + 1} / ${n}</span><button type="button" id="lb-x" aria-label="Fermer">×</button></div>
    <div class="lb-stage" id="lb-stage">${vid
      ? `<video id="lb-vid" src="${PUB + p.photo}" poster="${PUB + p.vignette}" controls playsinline preload="metadata"></video>`
      : `<img id="lb-img" src="${PUB + p.vignette}" alt="${p.legende ? esc(p.legende) : "Photo du tournoi"}">`}
      ${lbPos > 0 ? `<button class="lb-nav prev" type="button" id="lb-prev" aria-label="Précédent">‹</button>` : ""}
      ${lbPos < n - 1 ? `<button class="lb-nav next" type="button" id="lb-next" aria-label="Suivant">›</button>` : ""}</div>
    <div class="lb-info"><div><b>${p.auteur ? esc(p.auteur) : "Anonyme"}</b> · ${clockMu(Date.parse(p.created_at))}${vid && p.duree ? " · " + fmtDur(p.duree) : ""}</div>
      ${p.legende ? `<div class="cap">${esc(p.legende)}</div>` : ""}
      <div class="lb-actions"><a class="btn" href="${PUB + p.photo}?download=fun-padel-${p.id}.${ext}" download="fun-padel-${p.id}.${ext}">Télécharger</a>
        ${canShare ? `<button class="btn" type="button" id="lb-share">Partager</button>` : ""}
        ${canDel ? `<button class="btn" type="button" id="lb-del">Retirer</button>` : ""}</div></div>
  </div>`;
  if (!vid) {
    const full = new Image();
    full.onload = () => { const el = $("#lb-img"); if (el && lbList[lbPos] === p.id) el.src = full.src; };
    full.src = PUB + p.photo;
  }
  const st = $("#lb-stage"); let x0 = null, y0 = 0;
  st.addEventListener("touchstart", e => {
    const t = e.touches[0], r = st.getBoundingClientRect();
    x0 = e.touches.length === 1 && !(vid && t.clientY > r.bottom - 90) ? t.clientX : null; y0 = t.clientY;
  }, { passive: true });
  st.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbMove(dx < 0 ? 1 : -1);
  });
}
function lbMove(d) { const k = lbPos + d; if (k >= 0 && k < lbList.length) { lbPos = k; renderLightbox(); } }
async function lbShare() {
  const p = photos.find(x => x.id === lbList[lbPos]); if (!p) return;
  try {
    const blob = await (await fetch(PUB + p.photo)).blob();
    const file = new File([blob], `fun-padel-${p.id}.jpg`, { type: "image/jpeg" });
    if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: document.title });
    else location.href = `${PUB + p.photo}?download=fun-padel-${p.id}.jpg`;
  } catch (e) { if (e && e.name !== "AbortError") toast("Partage impossible, utilisez Télécharger"); }
}
async function lbDelete() {
  const id = lbList[lbPos], p = photos.find(x => x.id === id);
  if (!confirm(`Retirer cette ${p && p.type === "video" ? "vidéo" : "photo"} de l'album ? Elle ne sera plus visible par personne.`)) return;
  try {
    const res = await fetch(RPC + "fun_padel_retirer_photo", { method: "POST", headers: await FP.entetes({ "Content-Type": "application/json" }), body: JSON.stringify({ p_id: id, p_cle: devKey }) });
    if (!res.ok || !(await res.json())) throw new Error("refus");
    photos = photos.filter(x => x.id !== id); store.set(K("photos"), photos);
    myPhotos = myPhotos.filter(x => x !== id); store.set(K("myphotos"), myPhotos);
    closeSheet(); render(); toast("Retiré de l'album");
  } catch { toast("Impossible de retirer. Vérifiez votre connexion."); }
}

/* ---------- Synchronisation ---------- */
let tick = 0;
async function refresh() {
  if (!T) return;
  try {
    const h = { headers: await FP.entetes(), cache: "no-store" };
    const jobs = [
      fetch(`${API}?select=match,score_a,score_b,saisi_par,created_at&tournoi=eq.${T.id}&order=id.asc`, h),
      fetch(`${REMP}?select=joueur,remplacant,a_partir_du_tour,saisi_par,created_at&tournoi=eq.${T.id}&order=id.asc`, h)];
    if (tick++ % 4 === 0) jobs.push(fetch(`${REST}fun_padel_tournois?select=*&id=eq.${T.id}`, h));
    const [res, res2, res3] = await Promise.all(jobs);
    if (!res.ok || !res2.ok) throw new Error("sync");
    const fresh = await res.json(), fresh2 = await res2.json(), sig = r => r.length + "|" + (r.length ? r[r.length - 1].created_at : "");
    let changed = sig(fresh) !== sig(rows) || sig(fresh2) !== sig(repRows);
    if (res3 && res3.ok) {
      const [row] = await res3.json();
      if (row && row.updated_at !== T.updated_at) { applyTournament(row); saveTournament(row); changed = true; }
    }
    rows = fresh; repRows = fresh2; lastSync = Date.now(); online = true;
    store.set(K("rows"), rows); store.set(K("reps"), repRows); store.set(K("sync"), lastSync);
    rebuild(); if (changed && sheetMatch === null) render(); else renderSync();
  } catch { online = false; renderSync(); }
}
function renderSync() {
  const el = $("#sync");
  el.className = "sync" + (online ? "" : " off");
  el.textContent = online ? (lastSync ? `Scores à jour à ${clockMu(lastSync)} · actualisation automatique` : "Chargement des scores…")
    : `Hors connexion · derniers scores de ${lastSync ? clockMu(lastSync) : "?"}`;
}

/* ---------- Rendu et navigation ---------- */
const TABS = ["matchs", "moi", "classement", "photos", "vote"];
function render() {
  if (!T) return;
  renderStatus();
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  for (const t of TABS) $("#view-" + t).hidden = t !== tab;
  if (tab === "matchs") renderMatchs(); else if (tab === "moi") renderMoi(); else if (tab === "classement") renderClassement();
  else if (tab === "photos") renderPhotos();
  else if (!$("#view-vote").childElementCount || voted || !writable()) { renderVote(); loadResults(); } else renderVoteResults();
  renderSync();
}
function go(t) {
  if (t === "vote" && !VOTE_ON) t = "matchs";
  tab = t; if (location.hash !== "#" + t) history.replaceState(null, "", location.search + "#" + t);
  render(); window.scrollTo({ top: 0 }); if (t === "vote") loadResults(); if (t === "photos") loadPhotos();
}
let toastTimer;
function toast(msg) { const r = $("#toast-root"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer = setTimeout(() => r.innerHTML = "", 2600); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-tour],[data-enter],[data-me],[data-pick],[data-unme],[data-step],[data-set],[data-sub],[data-unsub],#sub-save,#save,#clear,#cancel,#bd,#share,#v-send,#v-again,[data-pf],[data-ph],#ph-send,#lb-x,#lb-prev,#lb-next,#lb-share,#lb-del");
  if (!e.target.closest(".finder") && $("#find-results") && !$("#find-results").hidden) { $("#find-results").hidden = true; }
  if (!t) return;
  if (t.id === "share") { share(); return; }
  if (!T) return;
  if (t.dataset.pick !== undefined) { pick(Number(t.dataset.pick)); return; }
  if (t.id === "bd") { if (e.target === t) closeSheet(); return; }
  if (t.dataset.tab) go(t.dataset.tab);
  else if (t.dataset.tour) { selTour = Number(t.dataset.tour); renderMatchs(); }
  else if (t.dataset.enter !== undefined) openSheet(Number(t.dataset.enter));
  else if (t.dataset.me !== undefined) { me = Number(t.dataset.me); store.set(K("me"), me); render(); window.scrollTo({ top: 0 }); }
  else if (t.hasAttribute("data-unme")) { me = null; store.set(K("me"), null); render(); }
  else if (t.dataset.step) { const inp = $("#" + t.dataset.step); inp.value = Math.min(MAXS(), Math.max(0, (Number(inp.value) || 0) + Number(t.dataset.d))); }
  else if (t.dataset.set) { $("#" + t.dataset.set).value = CIBLE; }
  else if (t.id === "save") saveSheet(false);
  else if (t.id === "clear") saveSheet(true);
  else if (t.id === "cancel") closeSheet();
  else if (t.hasAttribute("data-sub")) openSub(null);
  else if (t.dataset.unsub !== undefined) cancelSub(Number(t.dataset.unsub));
  else if (t.id === "sub-save") saveSub();
  else if (t.id === "v-send") sendBallot();
  else if (t.id === "v-again") { voted = null; store.set(K("voted"), null); ballot = { voter: "", c: CATS.map(() => ""), rem: "" }; ballotTouched = true; renderVote(); window.scrollTo({ top: 0 }); }
  else if (t.dataset.pf) { photoFilter = t.dataset.pf; renderPhotos(); }
  else if (t.dataset.ph) openLightbox(Number(t.dataset.ph));
  else if (t.id === "ph-send") uploadAll();
  else if (t.id === "lb-x") closeSheet();
  else if (t.id === "lb-prev") lbMove(-1);
  else if (t.id === "lb-next") lbMove(1);
  else if (t.id === "lb-share") lbShare();
  else if (t.id === "lb-del") lbDelete();
});
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== tab) go(t); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetMatch !== null) closeSheet();
  else if (sheetMatch === -3 && (e.key === "ArrowLeft" || e.key === "ArrowRight")) lbMove(e.key === "ArrowLeft" ? -1 : 1);
});
async function share() {
  const url = location.origin + location.pathname + (T ? `?t=${encodeURIComponent(T.slug)}` : "");
  const title = T ? (T.config.nom || T.nom) : "Fun Padel";
  if (navigator.share) { try { await navigator.share({ title, text: `Planning, scores et classement : ${title}`, url }); } catch {} return; }
  try { await navigator.clipboard.writeText(url); toast("Lien copié"); } catch { toast(url); }
}

/* ---------- Démarrage ---------- */
function showMessage(title, html) {
  document.body.classList.add("nosite");
  $("#t-sous").textContent = "";
  $("#facts").innerHTML = "";
  for (const t of TABS) $("#view-" + t).hidden = true;
  const s = $("#setup"); s.hidden = false;
  s.innerHTML = `<div class="empty"><h3>${esc(title)}</h3>${html}</div>`;
}
function saveTournament(row) { store.set("fp_t_" + (slugParam || "_"), row); }
const slugParam = (new URLSearchParams(location.search).get("t") || "").toLowerCase().trim();

function start() {
  if (started) { rebuild(); render(); return; }
  started = true;
  document.body.classList.remove("nosite"); $("#setup").hidden = true;
  const h = location.hash.slice(1);
  if (TABS.includes(h) && (h !== "vote" || VOTE_ON)) tab = h;
  rebuild(); render(); refresh(); loadPhotos();
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 15000);
  setInterval(() => { if (document.visibilityState === "visible" && tab === "vote") loadResults(); }, 30000);
  setInterval(() => { if (document.visibilityState === "visible" && tab === "photos") loadPhotos(); }, 30000);
  setInterval(() => { renderStatus(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
}
async function loadOthers() {
  try {
    const res = await fetch(`${REST}fun_padel_tournois?select=slug,nom,jour,statut&statut=in.(publie,archive)&order=jour.desc,id.desc&limit=30`, { headers: await FP.entetes(), cache: "no-store" });
    if (!res.ok) return;
    const list = (await res.json()).filter(x => !T || x.slug !== T.slug);
    $("#others").innerHTML = list.length ? `<section class="others"><h3>Autres tournois</h3><ul>${list.map(x =>
      `<li><a href="?t=${encodeURIComponent(x.slug)}">${esc(x.nom)}<span>${esc(FP.dateLongue(x.jour, true))}</span></a></li>`).join("")}</ul></section>` : "";
  } catch {}
}
async function boot() {
  if (!FP.configure) {
    showMessage("Site pas encore branché sur la base", `<p>Ouvrez le fichier <code>config.js</code> et remplacez l'adresse et la clé par celles de votre projet Supabase (voir le guide d'installation).</p>`);
    return;
  }
  const cached = store.get("fp_t_" + (slugParam || "_"), null);
  if (cached) { applyTournament(cached); start(); }
  try {
    const q = slugParam ? `slug=eq.${encodeURIComponent(slugParam)}` : "statut=eq.publie&order=jour.desc,id.desc&limit=1";
    const res = await fetch(`${REST}fun_padel_tournois?select=*&${q}`, { headers: await FP.entetes(), cache: "no-store" });
    if (!res.ok) throw new Error(String(res.status));
    const [row] = await res.json();
    if (!row) {
      store.set("fp_t_" + (slugParam || "_"), null);
      showMessage(slugParam ? "Tournoi introuvable" : "Aucun tournoi en cours",
        slugParam ? `<p>Ce lien ne correspond à aucun tournoi publié. Vérifiez l'adresse ou demandez le bon lien aux organisateurs.</p>`
                  : `<p>Aucun tournoi n'est publié pour l'instant. Les organisateurs le créent depuis la page <a href="admin.html">Organisateurs</a>.</p>`);
      loadOthers();
      return;
    }
    saveTournament(row);
    if (!T || T.id !== row.id || T.updated_at !== row.updated_at) { applyTournament(row); start(); render(); }
  } catch {
    if (!cached) showMessage("Connexion impossible", `<p>Le tournoi n'a pas pu être chargé. Vérifiez votre connexion internet puis rechargez la page.</p>`);
  }
  loadOthers();
}
boot();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
